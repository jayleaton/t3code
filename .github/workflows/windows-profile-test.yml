name: Windows credential profile

on:
  pull_request:
    paths:
      - "apps/desktop/src/app/WindowsSharedProfile*"
      - ".github/workflows/windows-profile-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credentials:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          run-install: false
      - name: Install desktop dependencies
        run: vp install --frozen-lockfile --filter=@t3tools/desktop...
      - name: Verify native Windows credential sharing
        env:
          NODE_ENV: test
        run: |
          node apps/desktop/scripts/ensure-electron-runtime.mjs
          vp test run apps/desktop/src/app/WindowsSharedProfile.test.ts apps/desktop/src/app/WindowsSharedProfile.windows.test.ts
